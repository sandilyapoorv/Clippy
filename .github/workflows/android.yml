name: Android

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f07c5761f61c6aa09\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646161d0d3dcd7889b4816238a8339\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Assemble signed release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clippy-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: clippy-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Clippy 1.3.0
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          body: |
            Clippy 1.3.0 fixes background writes: copies are flushed to a committed inbox plus SQLite so history survives when Clippy is not on screen. Enable the Clippy accessibility service.

            ## Install
            1. Download `app-release.apk`
            2. Allow install from this source
            3. Open Clippy and tap **Enable Clippy accessibility**
            4. Turn on Clippy clipboard capture
            5. Copy in another app — the notification should say **Saved: …** even while Clippy is closed

            ## What this build is
            - Signed with the repo-committed Clippy keystore (stable for sideload updates from this repo; not a Play-protected upload key)
            - AAB attached for Play Console experiments
            - Accessibility capture of Copy/Cut and selected text, plus a tiny accessibility overlay peek for clipboard bytes (including images)

            ## Capture paths that work
            - Clippy accessibility service (works with the main app closed)
            - Always watching foreground service
            - Clippy is on screen
            - Save clipboard now
            - Quick Settings tile
            - Share sheet → Clippy
